<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom · 教學小工具</title>
<style>
  :root {
    --bg: #0f1720; --panel: #1b2530; --line: #33414f;
    --text: #e7edf3; --muted: #93a3b3; --accent: #4f9df7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 64px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  a.tool {
    display: block; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px; margin-bottom: 16px; transition: .12s;
  }
  a.tool:hover { border-color: var(--accent); transform: translateY(-1px); }
  a.tool h2 { margin: 0 0 4px; font-size: 18px; }
  a.tool p { margin: 0; color: var(--muted); font-size: 14px; }
  .emoji { font-size: 22px; margin-right: 8px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 16px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🏫 Classroom</h1>
    <p class="sub">一些自己動手做的教學 / 備課小工具，全部在瀏覽器裡跑，檔案不上傳。</p>

    <a class="tool" href="slides-to-video.html">
      <h2><span class="emoji">🎬</span>簡報 + 錄音 → 影片</h2>
      <p>把一份 PDF 簡報和一整段錄音，用「邊聽邊點換頁」的方式合成影片（WebM）。適合把講稿錄音配上投影片變成教學影片。</p>
    </a>

    <a class="tool" href="earth-evolution.html">
      <h2><span class="emoji">🌏</span>地球演化：板塊漂移與生物</h2>
      <p>一顆會轉的地球，從 46 億年前的冥古宙一路播到現在：陸塊聚合分裂、海洋顏色、冰河期，配上每個年代的代表生物。可拉時間軸跳到任一年代，最後會標出台灣。</p>
    </a>

    <footer>
      全部工具皆為純前端、離線可用；你的檔案只留在自己的瀏覽器裡。
    </footer>
  </div>
</body>
</html>
